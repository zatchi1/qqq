name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests (calculator engine)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: W-SPACE-CALCULATOR-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: W-SPACE-CALCULATOR-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub Release (direct download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk W-SPACE-CALCULATOR.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest W-SPACE-CALCULATOR.apk \
            --title "W-SPACE CALCULATOR (latest build)" \
            --notes "APK for Android 9+. Built from commit ${GITHUB_SHA::7}."
