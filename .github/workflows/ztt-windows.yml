# Builds the ztt (Yapfast) Windows installer, on demand:
# Actions > "ztt Windows installer" > Run workflow.
# 1. Linux job: cross-builds yapfast.exe with the project's own Nix + cargo-xwin
#    setup and makes the portable ZIP (the project's --no-installer path).
# 2. Windows job: compiles packaging/windows/yapfast.iss with Inno Setup 7 over
#    the ZIP's files, giving Yapfast-<version>-windows-x64-setup.exe.
name: ztt Windows installer

on:
  workflow_dispatch:
  push:
    branches: [add-ztt-windows-build]
    paths: ['ztt/**', '.github/workflows/ztt-windows.yml']

permissions:
  contents: read

env:
  PROJECT_DIR: ztt

jobs:
  build-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ztt
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-${{ hashFiles('ztt/nix/flake.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ztt
          cache-on-failure: true
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          version="${current%%-*}-ztt.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/set-version "$version"
      - name: Build yapfast.exe and the portable ZIP
        run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ztt/target/dist/discord/Yapfast-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  installer:
    needs: build-zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ztt/packaging/windows
            ztt/LICENSE
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $sha = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\is.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\is.exe" -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "Inno Setup checksum mismatch" }
          Start-Process "$env:RUNNER_TEMP\is.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/DIR=C:\InnoSetup','/NOICONS'
          if (-not (Test-Path C:\InnoSetup\ISCC.exe)) { throw "ISCC.exe not found" }
      - name: Compile the installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build-zip.outputs.version }}
        run: |
          $zip = Get-ChildItem dist -Filter "Yapfast-*-windows-x64.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $src = (Get-ChildItem pkg -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$src\yapfast.exe")) { $src = (Resolve-Path pkg).Path }
          $number = $env:VERSION.Split('-')[0]
          New-Item -ItemType Directory -Force out | Out-Null
          & C:\InnoSetup\ISCC.exe /Q "/DAppVersion=$env:VERSION" "/DVersionNumber=$number" "/DSourceDir=$src" `
            "/DLicenseFile=$((Resolve-Path ztt\LICENSE).Path)" "/O$((Resolve-Path out).Path)" ztt\packaging\windows\yapfast.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: ztt-windows-installer
          path: out/*.exe
          if-no-files-found: error
          compression-level: 0
